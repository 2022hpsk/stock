[project]
name = "quantstock"
version = "0.1.0"
description = "A股/场内基金 个人量化投研与半自动交易系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # 核心数值与数据
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pandera>=0.20",
    # 配置与校验
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # 基础设施
    "structlog>=24.1",
    "tenacity>=8.3",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    # 数据源
    "akshare>=1.14",
    "baostock>=0.8.9",
    "requests>=2.32",
    "httpx>=0.27",
    # 情报模块
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "simhash>=2.1",
    # CLI 与报告
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "plotly>=5.22",
]

[project.optional-dependencies]
tushare = ["tushare>=1.4"]
llm = ["anthropic>=0.40"]
serve = ["fastapi>=0.111", "uvicorn>=0.30"]
# XtQuant 由券商 miniQMT 客户端提供，不通过 PyPI 安装，见 docs/03-功能规格.md F8.2

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "detect-secrets>=1.5",
    "types-pyyaml",
    "types-requests",
    "types-python-dateutil",
    "pandas-stubs",
]

[project.scripts]
quantstock = "quantstock.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantstock"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "C4",          # comprehensions
    "C90",         # mccabe complexity
    "DTZ",         # flake8-datetimez —— 强制 tz-aware（开发规范 R3）
    "S",           # bandit 安全
    "A",           # builtins shadowing
    "RET", "SIM", "ARG", "PTH", "ERA", "PL", "RUF",
    "ANN",         # 强制类型注解
    "D",           # docstring
    "T20",         # 禁止 print（开发规范第七条）
]
ignore = [
    "D100", "D104",   # 模块/包级 docstring 不强制
    "D203", "D213",   # 与 D211/D212 冲突
    "PLR0913",        # 参数个数由 review 把关
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004", "ARG"]
"src/quantstock/cli/**" = ["T20"]   # CLI 通过 rich console 输出

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false
disallow_any_generics = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["akshare.*", "baostock.*", "tushare.*", "simhash.*", "feedparser.*", "plotly.*", "xtquant.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=quantstock",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "slow: 耗时较长的测试",
    "network: 需要真实网络（CI 中默认跳过）",
    "golden: 回测黄金测试，结果变更需显式更新快照",
]
filterwarnings = ["error::DeprecationWarning:quantstock.*"]

[tool.coverage.run]
branch = true
source = ["src/quantstock"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- import-linter
# 强制开发规范"分层依赖单向向下"
[tool.importlinter]
root_package = "quantstock"

[[tool.importlinter.contracts]]
name = "分层架构：依赖只能向下"
type = "layers"
layers = [
    "quantstock.cli",
    "quantstock.advisor",
    "quantstock.execution | quantstock.reporting | quantstock.portfolio | quantstock.risk | quantstock.strategy | quantstock.account",
    "quantstock.backtest | quantstock.factors",
    "quantstock.intel",
    "quantstock.data",
    "quantstock.infra",
    "quantstock.config",
]

[[tool.importlinter.contracts]]
name = "data 层不得依赖 intel 层"
type = "forbidden"
source_modules = ["quantstock.data"]
forbidden_modules = ["quantstock.intel"]

[[tool.importlinter.contracts]]
name = "只有 execution 可以接触券商 SDK"
type = "forbidden"
source_modules = [
    "quantstock.data", "quantstock.intel", "quantstock.factors", "quantstock.strategy",
    "quantstock.portfolio", "quantstock.risk", "quantstock.backtest", "quantstock.advisor",
]
forbidden_modules = ["xtquant"]
